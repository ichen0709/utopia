# 每次 push 到 main:跑測試 → 編譯 → 發佈到 GitHub Pages。測試沒過就不發佈。
# 需要先到 repo 的 Settings → Pages,把 Source 設成「GitHub Actions」(見 docs/architecture.md 12.3)。
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # 和本機驗證過的版本一致(jsdom 需要 22.22.2 以上或 24.15 以上)
          node-version: 24
          cache: npm

      - name: 安裝套件
        run: npm ci

      - name: 檢查型別與 Svelte 語法
        run: npm run check

      - name: 跑自動測試
        run: npm test

      - name: 編譯
        run: npm run build
        env:
          # 階段一:使用瀏覽器內的模擬後端,不需要任何金鑰
          VITE_BACKEND: local
          # 階段二才需要(放在 repo 的 Settings → Secrets and variables → Actions → Variables,不是 Secrets):
          # VITE_BACKEND: ${{ vars.VITE_BACKEND }}
          # VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          # VITE_SUPABASE_PUBLISHABLE_KEY: ${{ vars.VITE_SUPABASE_PUBLISHABLE_KEY }}

      - name: 確認編譯結果裡沒有不該公開的金鑰字樣
        run: |
          if grep -rEIl 'service_role|sb_secret_' dist; then
            echo "dist 裡出現了不該公開的金鑰字樣,停止發佈"
            exit 1
          fi

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

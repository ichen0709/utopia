# 每次 push 到 main:金鑰檢查 → 型別檢查 → 測試 → 編譯 → 再檢查成品 → 發佈到 GitHub Pages。
# 任何一步沒過就不發佈。
# 需要先到 repo 的 Settings → Pages,把 Source 設成「GitHub Actions」(見 docs/architecture.md 12.3)。
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # 和本機驗證過的版本一致(jsdom 需要 22.22.2 以上或 24.15 以上)
          node-version: 24
          cache: npm

      - name: 金鑰檢查(repo 裡的檔案)
        run: bash scripts/check-secrets.sh repo

      - name: 安裝套件
        run: npm ci

      - name: 檢查型別與 Svelte 語法
        run: npm run check

      - name: 跑自動測試
        run: npm test

      - name: 編譯
        run: npm run build
        env:
          # 這兩個值都是「公開」的:專案網址、公開金鑰(sb_publishable_ 開頭)。
          # 放在 repo 的 Settings → Secrets and variables → Actions → Variables(不是 Secrets)。
          # 兩個都有,網站就連到真正的 Supabase;沒設定,就退回階段一的模擬後端。
          # 資料庫密碼、secret key、service_role key 不需要、也絕對不能放在這裡。
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ vars.VITE_SUPABASE_PUBLISHABLE_KEY }}

      - name: 金鑰檢查(打包後的網頁,會被公開;放行 publishable key)
        run: bash scripts/check-secrets.sh dist

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
